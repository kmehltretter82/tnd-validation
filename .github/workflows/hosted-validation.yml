name: hosted-validation

# Test-repository overlay, not part of tndlib: repeats the local VM evidence on the
# real hosted runner. It issues nothing and cannot change a certification flag.
# Steps continue past a failure so that one run records every result.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '2'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Record runner facts
        id: facts
        continue-on-error: true
        run: |
          mkdir -p reports
          {
            uname -a; grep PRETTY /etc/os-release; id; nproc; free -m; df -h /
            docker version --format '{{.Server.Version}}'
            docker info --format '{{.CgroupVersion}} {{.Driver}} {{.SecurityOptions}}'
            sudo -n true && echo sudo-ok
            for p in "$RUNNER_TEMP" "$(dirname "$RUNNER_TEMP")" "$HOME" /home; do stat -c '%a %U %n' "$p"; done
          } 2>&1 | tee reports/facts.txt

      - name: Install the x86-64 Lean archive through the verifier
        id: lean
        run: python3 audit/install_lean.py --dest "$RUNNER_TEMP/lean-4.35.0" --github

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          version: '0.9.6'
          enable-cache: false

      - name: Prepare
        id: prepare
        run: |
          set -o pipefail
          uv sync --frozen --extra dev
          docker pull -q ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          /usr/bin/time -v lake build 2>&1 | tee reports/lib-build.txt
          (cd audit && /usr/bin/time -v lake build) 2>&1 | tee reports/audit-build.txt

      - name: Real quota, tamper, and recovery harness in RUNNER_TEMP
        id: boundary
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --extra dev python tests/audit/linux_boundary_smoke.py \
            --scratch "$RUNNER_TEMP" | tee reports/boundary.json

      - name: Hostile container limits and Lean source
        id: limits
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --extra dev python tests/audit/linux_container_limits.py \
            --lean-root "$TND_LEAN_ROOT" | tee reports/limits.json

      - name: Git to admission, build, and export
        id: git
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/git-work"
          uv run --frozen --extra dev python tests/audit/linux_git_integration.py \
            --checker audit/.lake/build/bin/tnd-check \
            --exporter audit/.lake/build/bin/tnd-export \
            --lean-root "$TND_LEAN_ROOT" --work-dir "$RUNNER_TEMP/git-work" \
            | tee reports/git.jsonl

      - name: The recovery step finds nothing left to reconcile
        id: recovery
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m audit.resource_recovery --parent "$RUNNER_TEMP" | tee reports/recovery.json

      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-validation
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Fail visibly if any harness failed
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.facts.outcome }} ${{ steps.lean.outcome }} ${{ steps.prepare.outcome }}
            ${{ steps.boundary.outcome }} ${{ steps.limits.outcome }} ${{ steps.git.outcome }}
            ${{ steps.recovery.outcome }}
        run: |
          echo "$OUTCOMES"
          for outcome in $OUTCOMES; do test "$outcome" = success; done
