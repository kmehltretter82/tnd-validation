name: hosted-validation

# Test-repository overlay, not part of tndlib: runs every starter task through the
# real verifier and comparator, measures quota use, and stresses both quotas at once.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '2'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - run: mkdir -p reports
      - name: Install Lean through the verifier
        run: python3 audit/install_lean.py --dest "$RUNNER_TEMP/lean-4.35.0" --github
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          version: '0.9.6'
          enable-cache: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.0'
          cache: false
      - name: Build trusted tools
        env:
          CGO_ENABLED: '0'
        run: |
          uv sync --frozen --extra dev
          docker pull -q ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          go install github.com/zouuup/landrun/cmd/landrun@ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
          (cd audit && lake build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover/comparator
          ref: e3dcf3083fc53d44b27a4431fabf7d43181583f5
          path: .comparator-tool
          persist-credentials: false
      - name: Build the comparator
        working-directory: .comparator-tool
        run: lake build lean4export comparator
      - name: Start the sampler
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          nohup python3 .validation/sampler.py reports/usage.json reports/stage.txt >/dev/null 2>&1 &
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
      - name: Every task through the real verifier and comparator
        continue-on-error: true
        run: |
          set -o pipefail
          cp .validation/per_task.py .validation/stress.py "$RUNNER_TEMP/"
          git checkout -q "$BASE_SHA"
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/per_task.py" "$BASE_SHA" "$HEAD_SHA" \
            "$TND_LEAN_ROOT" "$(go env GOPATH)/bin/landrun" .comparator-tool "$RUNNER_TEMP/q" 2>&1 | tee reports/per-task.log
      - name: The admission corpus including the new notation
        continue-on-error: true
        run: |
          set -o pipefail
          git checkout -q "$BASE_SHA"
          # The test repository's own task was solved by its merged PR.
          cp .validation/map_exists_placeholder.txt tasks/map_exists.lean
          python3 audit/admission/test_admission.py --lean "$TND_LEAN_ROOT/bin/lean" 2>&1 | tail -4 | tee reports/admission.txt
      - name: Let the sampler flush and require a clean host
        if: always()
        run: |
          sleep 4
          python3 -m audit.resource_recovery --parent "$RUNNER_TEMP/q" --terminate-owner | tee reports/recovery.json
          echo "mounts: $(findmnt -rn -o TARGET | grep -c tnd-boundary)" | tee reports/after.txt
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measure
          path: reports/
          if-no-files-found: error
          retention-days: 30
