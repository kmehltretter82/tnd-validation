name: hosted-validation

# Test-repository overlay, not part of tndlib: repeats the local VM evidence on the
# real hosted runner. It issues nothing and cannot change a certification flag.
# Steps continue past a failure so that one run records every result.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: '2'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Record runner facts
        id: facts
        continue-on-error: true
        run: |
          mkdir -p reports
          {
            uname -a; grep PRETTY /etc/os-release; id; nproc; free -m; df -h /
            docker version --format '{{.Server.Version}}'
            docker info --format '{{.CgroupVersion}} {{.Driver}} {{.SecurityOptions}}'
            sudo -n true && echo sudo-ok
            for p in "$RUNNER_TEMP" "$(dirname "$RUNNER_TEMP")" "$HOME" /home; do stat -c '%a %U %n' "$p"; done
          } 2>&1 | tee reports/facts.txt

      - name: Install the x86-64 Lean archive through the verifier
        id: lean
        run: python3 audit/install_lean.py --dest "$RUNNER_TEMP/lean-4.35.0" --github

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          version: '0.9.6'
          enable-cache: false

      - name: Prepare
        id: prepare
        run: |
          set -o pipefail
          uv sync --frozen --extra dev
          docker pull -q ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          /usr/bin/time -v lake build 2>&1 | tee reports/lib-build.txt
          (cd audit && /usr/bin/time -v lake build) 2>&1 | tee reports/audit-build.txt

      - name: Real quota, tamper, and recovery harness in RUNNER_TEMP
        id: boundary
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --extra dev python tests/audit/linux_boundary_smoke.py \
            --scratch "$RUNNER_TEMP" | tee reports/boundary.json

      - name: Hostile container limits and Lean source
        id: limits
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --extra dev python tests/audit/linux_container_limits.py \
            --lean-root "$TND_LEAN_ROOT" | tee reports/limits.json

      - name: Git to admission, build, and export
        id: git
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/git-work"
          cp .choir/certification.json "$RUNNER_TEMP/certification.json.bak"
          trap 'mv "$RUNNER_TEMP/certification.json.bak" .choir/certification.json' EXIT
          cat <<'EOF' > .choir/certification.json
          {
            "schema_version": 1,
            "source_binding_validated": false,
            "resource_boundary_validated": false,
            "resource_limits": null,
            "reason": "Development harness check."
          }
          EOF
          uv run --frozen --extra dev python tests/audit/linux_git_integration.py \
            --checker audit/.lake/build/bin/tnd-check \
            --exporter audit/.lake/build/bin/tnd-export \
            --lean-root "$TND_LEAN_ROOT" --work-dir "$RUNNER_TEMP/git-work" \
            | tee reports/git.jsonl

      - name: Measure selected production quota usage on library and task builds
        id: quota
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --frozen --extra dev python - <<'PY' | tee reports/quota-measurements.json
          import json, os, shutil, tempfile, threading, time
          from pathlib import Path
          from audit import run as driver
          from audit.resource_boundary import Limits
          from audit.resource_stages import QuotaStages

          ROOT = Path.cwd()
          lean_root = Path(os.environ["TND_LEAN_ROOT"]).resolve()
          exporter = (ROOT / "audit/.lake/build/bin/tnd-export").resolve()
          scratch = Path(os.environ["RUNNER_TEMP"]).resolve()
          build_lim = Limits(1073741824, 100000)
          export_lim = Limits(268435456, 4096)

          def sample_stage(source_dir: Path, module: str, namespace: str) -> dict:
              peaks = {"build_bytes": 0, "build_inodes": 0, "export_bytes": 0, "export_inodes": 0, "samples": 0}
              stop = threading.Event()
              with QuotaStages(scratch, build_lim, export_lim) as stages:
                  b_path = stages.boundary.root / "build"
                  e_path = stages.boundary.root / "export"
                  def sampler():
                      while not stop.is_set():
                          try:
                              vb = os.statvfs(b_path)
                              ve = os.statvfs(e_path)
                              peaks["build_bytes"] = max(peaks["build_bytes"], (vb.f_blocks - vb.f_bfree) * vb.f_frsize)
                              peaks["build_inodes"] = max(peaks["build_inodes"], vb.f_files - vb.f_ffree)
                              peaks["export_bytes"] = max(peaks["export_bytes"], (ve.f_blocks - ve.f_bfree) * ve.f_frsize)
                              peaks["export_inodes"] = max(peaks["export_inodes"], ve.f_files - ve.f_ffree)
                              peaks["samples"] += 1
                          except OSError:
                              pass
                          time.sleep(0.05)
                  t = threading.Thread(target=sampler, daemon=True)
                  t.start()
                  t0 = time.monotonic()
                  try:
                      out = stages.build_export(driver.IMAGE, source_dir, lean_root, exporter, module, namespace)
                  finally:
                      stop.set()
                      t.join(timeout=2)
                  elapsed = round(time.monotonic() - t0, 3)
              return {**peaks, "elapsed_seconds": elapsed, "export_output_bytes": len(out)}

          with tempfile.TemporaryDirectory(prefix="tnd-quota-measure-", dir=scratch) as tmp:
              tmp_path = Path(tmp)
              lib_src = tmp_path / "lib"
              lib_src.mkdir()
              (lib_src / ".lake").mkdir()
              for name in ("TNDLib.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain"):
                  shutil.copy2(ROOT / name, lib_src / name)
              shutil.copytree(ROOT / "TNDLib", lib_src / "TNDLib")
              lib_metrics = sample_stage(lib_src, "TNDLib", "TNDLib")

              task_src = tmp_path / "task"
              shutil.copytree(lib_src, task_src)
              (task_src / "TNDTask.lean").write_bytes((ROOT / "tests/tasks/cert_cantor_falsifier_solution.lean").read_bytes())
              (task_src / "lakefile.toml").write_text(
                  'name = "tnd_candidate"\nversion = "0.0.0"\ndefaultTargets = ["TNDLib", "TNDTask"]\n'
                  '[[lean_lib]]\nname = "TNDLib"\n[[lean_lib]]\nname = "TNDTask"\n'
              )
              task_metrics = sample_stage(task_src, "TNDTask", "TNDTask")

          print(json.dumps({
              "selected_limits": {
                  "build_bytes": build_lim.bytes,
                  "build_inodes": build_lim.inodes,
                  "export_bytes": export_lim.bytes,
                  "export_inodes": export_lim.inodes,
              },
              "library_59_declarations": lib_metrics,
              "task_cert_cantor_falsifier": task_metrics,
          }, indent=2))
          PY

      - name: The recovery step finds nothing left to reconcile
        id: recovery
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m audit.resource_recovery --parent "$RUNNER_TEMP" | tee reports/recovery.json

      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-validation
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Fail visibly if any harness failed
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.facts.outcome }} ${{ steps.lean.outcome }} ${{ steps.prepare.outcome }}
            ${{ steps.boundary.outcome }} ${{ steps.limits.outcome }} ${{ steps.git.outcome }}
            ${{ steps.quota.outcome }} ${{ steps.recovery.outcome }}
        run: |
          echo "$OUTCOMES"
          for outcome in $OUTCOMES; do test "$outcome" = success; done
