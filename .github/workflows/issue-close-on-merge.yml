name: issue-close-on-merge

# When a PR merges to main, identify the one Choir task it closes (via a
# "Closes #N" / "Fixes #N" / "Resolves #N" keyword in the PR body) and:
# - remove choir/claimed and choir/available
# - add choir/done
# - post a "merged in #PR" comment
# - close the issue (GitHub may have already done this; we make sure)
#
# Then repin the siblings: any open *unclaimed* task whose target_file this
# PR touched is still pinned to a tree that no longer has that text, so its
# next worker would start from stale source. The merge knows which files it
# touched, so the affected tasks fall out of the event — no history walk.
# Claimed tasks are left alone deliberately (`orchestrator/repin.py`).

# `pull_request_target`, not `pull_request`, and that is load-bearing under
# spec D4 (open contribution). Every PR now arrives from a contributor's
# fork, and a `pull_request` event from a fork is granted a READ-ONLY token
# with no secrets — so this workflow, which needs `issues: write` to close
# the task issue, could never do its job on any real submission. On
# `pull_request_target` the event runs in the base repository's context and
# gets the write token it needs.
#
# That trade is only safe because of the checkout below. `pull_request_target`
# is the well-known foot-gun: it hands a write token to a workflow triggered
# by an untrusted PR, so a workflow that checks out and *executes* the PR's
# code is handing that token to the contributor. This one must never do
# that — see the checkout step.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

# Serialize all main-branch lifecycle updates. The ancestry guard in
# orchestrator.repin remains authoritative, but this also prevents two merge
# events from racing between their issue re-read and write.
concurrency:
  group: tnd-main-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  close:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Execute only maintained code from the explicitly trusted base commit,
      # never the contributor head. The write token must not be persisted in
      # the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          version: '0.9.6'
          enable-cache: false

      - name: Install Python deps
        run: uv sync --frozen --extra dev

      - name: Save PR body to a file
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .close-tmp
          printf '%s' "$BODY" > .close-tmp/body.txt

      - name: Extract closing-issue numbers
        run: |
          uv run --frozen --extra dev python -m gate.state.close_on_merge_cli \
            --body-file .close-tmp/body.txt \
            > .close-tmp/numbers.txt
          echo "Validated Choir task issue: #$(cat .close-tmp/numbers.txt)"

      - name: Mark the validated Choir task done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue=$(cat .close-tmp/numbers.txt)
          uv run --frozen --extra dev python -m gate.state.issue_updates \
            --repo "$REPO" --issue "$issue" complete --pr "$PR_NUMBER"

      - name: Repin unclaimed tasks on the files this PR touched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" --json files \
            --jq '.files[].path' > .close-tmp/files.txt
          uv run --frozen --extra dev python -m orchestrator.repin \
            --repo "$REPO" \
            --commit "$MERGE_SHA" \
            --files-file .close-tmp/files.txt
